version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: nexis-postgres
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=nexis_postgres
      - POSTGRES_DB=nexis_chat
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7.0
    container_name: nexis-redis
    ports:
      - "6380:6379"
    restart: always

  chroma:
    image: chromadb/chroma:latest
    container_name: nexis-chroma
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
    restart: always

  neo4j:
    image: neo4j:5.12-community
    container_name: nexis-neo4j
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    environment:
      - NEO4J_AUTH=neo4j/nexis_password
    volumes:
      - neo4j_data:/data
    restart: always

  rag_api:
    build: ./services/rag_api
    container_name: nexis_rag_api
    ports:
      - "8001:8000"
    environment:
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=nexis_password
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - chroma
      - neo4j
    volumes:
      - ./services/rag_api:/app
      - ./.env:/app/.env

  web-ui:
    build: ./web-ui
    container_name: nexis_web_ui
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8001
    volumes:
      - ./web-ui:/app
      - /app/node_modules
    stdin_open: true
    tty: true
    depends_on:
      - rag_api

  worker:
    build: ./services/worker
    container_name: nexis-worker
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=nexis_password
      - NEO4J_PASSWORD=nexis_password
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - redis
      - chroma
      - neo4j
    volumes:
      - ./raw_docs:/app/raw_docs # For file watcher (legacy) or debug

volumes:
  chroma_data:
  neo4j_data:
  postgres_data:
