
services:
  postgres:
    image: postgres:15-alpine
    container_name: nexis-postgres
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=nexis_postgres
      - POSTGRES_DB=nexis_chat
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7.0
    container_name: nexis-redis
    ports:
      - "6380:6379"
    restart: always

  chroma:
    image: chromadb/chroma:latest
    container_name: nexis-chroma
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/data
    environment:
      - IS_PERSISTENT=TRUE
    restart: always

  neo4j:
    image: neo4j:5.12-community
    container_name: nexis-neo4j
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    environment:
      - NEO4J_AUTH=neo4j/nexis_password
    volumes:
      - neo4j_data:/data
    restart: always

  rag_api:
    build: 
      context: .
      dockerfile: Dockerfile.rag
    container_name: nexis_rag_api
    ports:
      - "8001:8000"
    environment:
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=nexis_password
      - DATABASE_URL=postgresql://postgres:nexis_postgres@postgres:5432/nexis_chat
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - chroma
      - neo4j
      - postgres
      - redis
    volumes:
      - ./raw_docs:/app/raw_docs
      - ./processed_docs:/app/processed_docs
      - ./python_services:/app/python_services
      - ./services/rag_api:/app/services/rag_api

  worker:
    build: 
      context: .
      dockerfile: Dockerfile.worker
    container_name: nexis_worker
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=nexis_password
      - DATABASE_URL=postgresql://postgres:nexis_postgres@postgres:5432/nexis_chat
      - AGENT_API_URL=http://agent_api:8002
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - redis
      - chroma
      - neo4j
      - postgres
      - agent_api
    volumes:
      - ./raw_docs:/app/raw_docs
      - ./processed_docs:/app/processed_docs
      - ./python_services:/app/python_services
      - ./services/worker:/app/services/worker

  agent_api:
    build: ./services/agent
    container_name: nexis_agent_api
    ports:
      - "8002:8002"
    environment:
      - AGENT_PORT=8002
      - RAG_API_URL=http://rag_api:8000
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://postgres:nexis_postgres@postgres:5432/nexis_chat
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - postgres
      - rag_api
      - redis
    volumes:
      - ./services/agent:/app
      - /app/node_modules

  web-ui:
    build: ./web-ui
    container_name: nexis_web_ui
    ports:
      - "5173:5173"
    environment:
      # These must be relative paths to use the Vite proxy for remote access
      - VITE_API_BASE_URL=/api
      - VITE_AGENT_API_URL=/agent
    volumes:
      - ./web-ui:/app
      - /app/node_modules
    stdin_open: true
    tty: true
    depends_on:
      - rag_api
      - agent_api

volumes:
  chroma_data:
  neo4j_data:
  postgres_data:
