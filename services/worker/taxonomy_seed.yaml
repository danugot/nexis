# Nexis Master Taxonomy (Bill Business & Financing)
# Version: v1.0 (Seeded by User)

- Domain: 票据业务
  Modules:
    - 概览
      SubModules:
        - 待办事项: [代办, 业务量统计]
    - 服务开通
      SubModules:
        - 开通申请: [企业信息, 账户信息]
    - 签约管理
      SubModules:
        - 信息管理: [企业信息, 账户信息, 有限追索开通]
    - 出票业务
      SubModules:
        - 出票登记: [出票申请, 信息披露验证, 初始信息录入]
        - 提示承兑: [提示承兑申请, 承兑人签收, 承兑人驳回]
        - 提示收票: [提示收票申请, 收款人签收, 收款人驳回]
        - 票据保证: [出票保证申请, 承兑保证申请, 保证人签收]
    - 背书业务
      SubModules:
        - 背书转让: [背书申请, 被背书人签收]
        - 背书保证: [背书保证申请, 保证签收]
    - 质押业务
      SubModules:
        - 质押申请: [发起质押, 质权人签收]
        - 质押解除: [解除申请, 出质人签收]
    - 提示付款
      SubModules:
        - 到期付款: [提示付款申请, 承兑人付款签收]
        - 提前/逾期付款: [提前提示付款, 逾期提示付款]
    - 追索清偿
      SubModules:
        - 追索通知: [发起追索, 拒付证明]

- Domain: 票据融资
  Modules:
    - 在线融资
      SubModules:
        - 融资申请: [银票融资, 商票融资, 询价]
        - 贸易背景: [合同管理, 发票上传]
        - 放款管理: [保理审单, 缴费, 借据管理]
