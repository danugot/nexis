<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="nexis-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="link-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" rx="45" fill="url(#nexis-grad)" />
  
  <!-- Network Edges/Links -->
  <path d="M100 50 L150 90 L130 150" fill="none" stroke="url(#link-grad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M100 50 L50 90 L70 150" fill="none" stroke="url(#link-grad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M50 90 L150 90" fill="none" stroke="url(#link-grad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M70 150 L130 150" fill="none" stroke="url(#link-grad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M100 50 L100 100 L70 150" fill="none" stroke="url(#link-grad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M100 100 L130 150" fill="none" stroke="url(#link-grad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Network Nodes -->
  <circle cx="100" cy="50" r="16" fill="#60a5fa" />
  <circle cx="50" cy="90" r="14" fill="#818cf8" />
  <circle cx="150" cy="90" r="14" fill="#a78bfa" />
  <circle cx="70" cy="150" r="16" fill="#34d399" />
  <circle cx="130" cy="150" r="16" fill="#f43f5e" />
  <circle cx="100" cy="100" r="18" fill="#f8fafc" />
</svg>
